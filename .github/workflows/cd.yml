name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev curl
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
      - run: make test
      - name: Build native extension archive
        shell: bash
        run: make package PACKAGE_NAME="sqlite-jev-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
      - name: Build and test Python wheel
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS: native
      - name: Stage release files
        run: |
          mkdir release-dist
          cp build/*.tar.gz wheelhouse/*.whl release-dist/
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-jev-${{ matrix.platform }}
          path: release-dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.whl > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    name: Upload release to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build source distribution
        run: uv build --sdist
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always dist/*
